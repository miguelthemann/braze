name: Build Braze Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a compilar (ex: 1.3.6)'
        required: true
        default: '1.3.6'

jobs:
  build-linux:
    name: Build Linux (.deb & .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências (Ruby fpm & dpkg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Construir .deb e .rpm
        run: |
          chmod +x scripts/build-linux-packages.sh
          ./scripts/build-linux-packages.sh ${{ github.event.inputs.version || '1.3.6' }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: braze-debian
          path: build/*.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: braze-fedora
          path: build/*.rpm

  build-arch:
    name: Build Arch Linux (PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Instalar Dependências do Arch
        run: |
          pacman -Syu --noconfirm base-devel git sudo wget
          # Makepkg não pode correr como root
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser

      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          path: braze-src

      - name: Preparar Workspace e PKGBUILD
        run: |
          chown -R builduser:builduser braze-src
          su builduser -c "mkdir -p ~/build && cp braze-src/packaging/arch/PKGBUILD ~/build/"
          su builduser -c "cd ~/build && makepkg --noconfirm -s"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: braze-archlinux
          path: /home/builduser/build/*.pkg.tar.zst

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar NSIS
        uses: nsis-dev/setup-nsis@v1

      - name: Baixar Firefox Oficial (Gecko Base)
        shell: bash
        run: |
          # Baixar Firefox Oficial (estável) agora que a extensão está assinada na AMO
          url="https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
          curl -L -o "firefox-setup.exe" "$url"
          # Descomprimir Firefox Installer usando 7z
          "C:/Program Files/7-Zip/7z.exe" x -t7z firefox-setup.exe -y -o"firefox-unpacked"
          mkdir -p build-win/Braze
          cp -r firefox-unpacked/core/* build-win/Braze/

      - name: Injectar Braze Assets & Policies
        shell: bash
        run: |
          # 1. Configurar application.ini com identidade Braze para isolamento total de processos (IPC/Remoting)
          sed -i 's/^Name=Firefox/Name=Braze/' build-win/Braze/application.ini
          sed -i 's/^RemotingName=firefox/RemotingName=braze/' build-win/Braze/application.ini
          sed -i 's/^Vendor=Mozilla/Vendor=Braze/' build-win/Braze/application.ini

          # 2. Copiar distribuição, policies e extensão assinada para pré-instalação
          mkdir -p build-win/Braze/distribution/extensions
          cp distribution/policies.json build-win/Braze/distribution/policies.json
          cp braze-shields.xpi build-win/Braze/distribution/braze-shields.xpi
          cp braze-shields.xpi build-win/Braze/distribution/extensions/braze-shields@miguelthemann.github.io.xpi

          mkdir -p build-win/Braze/browser/distribution/extensions
          cp distribution/policies.json build-win/Braze/browser/distribution/policies.json
          cp braze-shields.xpi build-win/Braze/browser/distribution/braze-shields.xpi
          cp braze-shields.xpi build-win/Braze/browser/distribution/extensions/braze-shields@miguelthemann.github.io.xpi

          # 3. Configurar AutoConfig para sincronização automática de chrome/userChrome.css e preferências
          mkdir -p build-win/Braze/defaults/pref
          cp packaging/common/autoconfig.js build-win/Braze/defaults/pref/autoconfig.js
          mkdir -p build-win/Braze/browser/defaults/preferences
          cp packaging/common/autoconfig.js build-win/Braze/browser/defaults/preferences/autoconfig.js
          cp packaging/common/braze.cfg build-win/Braze/braze.cfg
          cp packaging/common/braze.cfg build-win/Braze/browser/braze.cfg

          # 4. Copiar chrome stylesheets e assets para serem injectados nos perfis
          mkdir -p build-win/Braze/chrome
          cp -r profile/chrome/* build-win/Braze/chrome/
          mkdir -p build-win/Braze/browser/chrome
          cp -r profile/chrome/* build-win/Braze/browser/chrome/

          # 3. Copiar assets para instalador e ícones
          cp -r assets build-win/Braze/assets

          # 4. Ícones internos da janela e do motor Gecko
          mkdir -p build-win/Braze/browser/chrome/icons/default
          cp assets/icon.ico build-win/Braze/browser/chrome/icons/default/main-window.ico
          cp assets/icon.ico build-win/Braze/browser/chrome/icons/default/default.ico

          # 5. Renomear firefox.exe para braze.exe e aplicar o ícone e metadados no binário com rcedit
          mv build-win/Braze/firefox.exe build-win/Braze/braze.exe
          curl -sL -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          ./rcedit.exe "build-win/Braze/braze.exe" --set-icon "assets/icon.ico" --set-version-string "ProductName" "Braze Browser" --set-version-string "FileDescription" "Braze Browser"

      - name: Construir Instalador NSIS
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            makensis "/DVERSION=${{ github.event.inputs.version || '1.3.6' }}" packaging/windows/installer.nsi
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=${{ github.event.inputs.version || '1.3.6' }}" packaging/windows/installer.nsi
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
            & "C:\Program Files\NSIS\makensis.exe" "/DVERSION=${{ github.event.inputs.version || '1.3.6' }}" packaging/windows/installer.nsi
          } else {
            throw "makensis executable could not be found"
          }

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: braze-windows
          path: Braze-Setup-*.exe

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependências Python (glean_parser)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-setuptools
          sudo pip install --break-system-packages "glean_parser~=20.1.0" || pip install --break-system-packages "glean_parser~=20.1.0" || pip install "glean_parser~=20.1.0"
          python3 -c "import glean_parser; print('glean_parser version:', glean_parser.__version__)"

      - name: Compilar APK Braze Android
        run: |
          cd mobile/android/fenix
          chmod +x gradlew
          VERSION="${{ github.event.inputs.version || '1.3.6' }}"
          ./gradlew :app:assembleBeta -PversionName="${VERSION}" --no-daemon -x test -PdisableOptimization || ./gradlew :app:assembleRelease -PversionName="${VERSION}" --no-daemon -x test -PdisableOptimization || ./gradlew :app:assembleDebug -PversionName="${VERSION}" --no-daemon -x test
          mkdir -p "$GITHUB_WORKSPACE/build-android-out"

          echo "A procurar APKs gerados..."
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" ! -name "*androidTest*"

          # Copiar APKs específicos de cada arquitetura e universal
          for apk in $(find "$GITHUB_WORKSPACE" -type f -name "*.apk" ! -name "*androidTest*"); do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              echo "Copiando APK ARM64: $apk"
              cp "$apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-arm64-v8a-${VERSION}.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              echo "Copiando APK ARMv7: $apk"
              cp "$apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-armeabi-v7a-${VERSION}.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              echo "Copiando APK x86_64: $apk"
              cp "$apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-x86_64-${VERSION}.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              echo "Copiando APK Universal: $apk"
              cp "$apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-universal-${VERSION}.apk"
            fi
          done

          # O APK principal (Braze-Browser-${VERSION}.apk) DEVE ser universal ou arm64-v8a (nunca x86_64 como prioritário)
          if [ -f "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-universal-${VERSION}.apk" ]; then
            echo "A definir APK principal a partir do universal APK"
            cp "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-universal-${VERSION}.apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-${VERSION}.apk"
          elif [ -f "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-arm64-v8a-${VERSION}.apk" ]; then
            echo "A definir APK principal a partir do arm64-v8a APK"
            cp "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-arm64-v8a-${VERSION}.apk" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-${VERSION}.apk"
          else
            FIRST_APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" ! -name "*androidTest*" | head -n 1)
            if [ -n "$FIRST_APK" ]; then
              echo "Aviso: A usar primeiro APK encontrado como fallback: $FIRST_APK"
              cp "$FIRST_APK" "$GITHUB_WORKSPACE/build-android-out/Braze-Browser-${VERSION}.apk"
            else
              echo "ERROR: Nenhum APK encontrado!"
              exit 1
            fi
          fi

          echo "Lista final de APKs gerados:"
          ls -la "$GITHUB_WORKSPACE/build-android-out/"

      - name: Assinar APK com a Chave de Release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Aviso: ANDROID_KEYSTORE_BASE64 não está configurado. A saltar assinatura com release key."
            exit 0
          fi

          # 1. Recuperar o ficheiro .jks a partir do secret em Base64
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

          # 2. Localizar o apksigner do Android SDK no runner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(which apksigner || true)
          fi
          echo "apksigner localizado: $APKSIGNER"

          # 3. Assinar os APKs gerados
          for apk in build-android-out/Braze-Browser-*.apk; do
            if [ -f "$apk" ]; then
              echo "A assinar APK: $apk"
              "$APKSIGNER" sign --ks release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                "$apk"
            fi
          done

          # 4. Apagar a chave temporária do disco do runner
          rm -f release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: braze-android
          path: build-android-out/*.apk

  create-release:
    name: Criar GitHub Release
    needs: [build-linux, build-arch, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Baixar todos os Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || '1.3.6' }}
          name: Braze Browser v${{ github.event.inputs.version || '1.3.6' }}
          draft: false
          prerelease: false
          files: release-artifacts/*
