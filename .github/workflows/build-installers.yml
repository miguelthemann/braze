name: Build Braze Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a compilar (ex: 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-linux:
    name: Build Linux (.deb & .rpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências (Ruby fpm & dpkg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Construir .deb e .rpm
        run: |
          chmod +x scripts/build-linux-packages.sh
          ./scripts/build-linux-packages.sh ${{ github.event.inputs.version }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: braze-debian
          path: build/*.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: braze-fedora
          path: build/*.rpm

  build-arch:
    name: Build Arch Linux (PKGBUILD)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Instalar Dependências do Arch
        run: |
          pacman -Syu --noconfirm base-devel git sudo wget
          # Makepkg não pode correr como root
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builduser

      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          path: braze-src

      - name: Preparar Workspace e PKGBUILD
        run: |
          chown -R builduser:builduser braze-src
          su builduser -c "mkdir -p ~/build && cp braze-src/packaging/arch/PKGBUILD ~/build/"
          su builduser -c "cd ~/build && makepkg --noconfirm -s"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: braze-archlinux
          path: /home/builduser/build/*.pkg.tar.zst

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar NSIS
        run: choco install nsis -y

      - name: Baixar Firefox Oficial (Gecko Base)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US"
          Invoke-WebRequest -Uri $url -OutFile "firefox-setup.exe"
          # Descomprimir Firefox Installer usando 7z
          & "C:\Program Files\7-Zip\7z.exe" x -t7z firefox-setup.exe -y -o.\firefox-unpacked
          New-Item -ItemType Directory -Force -Path .\build-win\Braze
          Copy-Item -Path ".\firefox-unpacked\core\*" -Destination .\build-win\Braze -Recurse

      - name: Injectar Braze Assets & Policies
        shell: powershell
        run: |
          # Copiar extensão, perfis e configurações
          New-Item -ItemType Directory -Force -Path .\build-win\Braze\distribution
          Copy-Item -Path distribution\policies.json -Destination .\build-win\Braze\distribution\policies.json
          Copy-Item -Path braze-shields.xpi -Destination .\build-win\Braze\distribution\braze-shields.xpi
          
          New-Item -ItemType Directory -Force -Path .\build-win\Braze\defaults\pref
          Copy-Item -Path profile\user.js -Destination .\build-win\Braze\defaults\pref\autoconfig.js
          
          # Copiar resources web e pasta extensão 
          Copy-Item -Path extension -Destination .\build-win\Braze\extension -Recurse
          Copy-Item -Path home -Destination .\build-win\Braze\home -Recurse
          
          # Renomear firefox.exe
          Rename-Item -Path .\build-win\Braze\firefox.exe -NewName braze.exe

      - name: Construir Instalador NSIS
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" packaging/windows/installer.nsi

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: braze-windows
          path: Braze-Setup-*.exe

  create-release:
    name: Criar GitHub Release
    needs: [build-linux, build-arch, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Baixar todos os Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Braze Browser v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: release-artifacts/**/*
