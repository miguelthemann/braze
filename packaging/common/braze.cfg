// braze.cfg - Braze Browser Startup Configuration
// First line must be a comment.

try {
  let { Services } = ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs");

  // 1. Enable custom styles and vertical tabs
  defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
  pref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

  defaultPref("sidebar.verticalTabs", true);
  pref("sidebar.verticalTabs", true);

  // 2. Set home and new tab
  defaultPref("browser.startup.homepage", "about:home");
  defaultPref("browser.newtabpage.enabled", true);
  defaultPref("browser.aboutConfig.showWarning", false);
  defaultPref("browser.tabs.warnOnClose", false);

  // 3. Telemetry and bloat opt-out
  defaultPref("toolkit.telemetry.enabled", false);
  defaultPref("datareporting.policy.dataSubmissionEnabled", false);
  defaultPref("app.shield.optoutstudies.enabled", false);
  defaultPref("app.normandy.enabled", false);

  // 4. Base theme & add-on defaults
  defaultPref("browser.theme.toolbar-theme", 0);
  defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
  defaultPref("extensions.autoDisableScopes", 0);
  defaultPref("extensions.enabledScopes", 15);
  defaultPref("extensions.installDistroAddons", true);
  defaultPref("xpinstall.signatures.required", false);

  // 5. Deploy chrome stylesheets and assets into the active profile
  let profDir = Services.dirsvc.get("ProfD", Ci.nsIFile);
  let installDir = Services.dirsvc.get("CurProcD", Ci.nsIFile);

  let targetChrome = profDir.clone();
  targetChrome.append("chrome");
  if (!targetChrome.exists()) {
    targetChrome.create(Ci.nsIFile.DIRECTORY_TYPE, 0755);
  }

  let srcChrome = installDir.clone();
  srcChrome.append("chrome");
  if (srcChrome.exists() && srcChrome.isDirectory()) {
    let entries = srcChrome.directoryEntries;
    while (entries.hasMoreElements()) {
      let file = entries.getNext().QueryInterface(Ci.nsIFile);
      let destFile = targetChrome.clone();
      destFile.append(file.leafName);
      if (destFile.exists()) {
        destFile.remove(false);
      }
      file.copyTo(targetChrome, file.leafName);
    }
  }

  // 6. Deploy signed extension to profile extensions folder as fallback
  let targetExtDir = profDir.clone();
  targetExtDir.append("extensions");
  if (!targetExtDir.exists()) {
    targetExtDir.create(Ci.nsIFile.DIRECTORY_TYPE, 0755);
  }

  let srcXpi = installDir.clone();
  srcXpi.append("distribution");
  srcXpi.append("extensions");
  srcXpi.append("braze-shields@miguelthemann.github.io.xpi");
  if (srcXpi.exists()) {
    let destXpi = targetExtDir.clone();
    destXpi.append("braze-shields@miguelthemann.github.io.xpi");
    if (!destXpi.exists()) {
      srcXpi.copyTo(targetExtDir, "braze-shields@miguelthemann.github.io.xpi");
    }
  }
} catch (e) {
  // Silent failover
}
